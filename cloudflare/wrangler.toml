# Zero Lines — site + forms on one Worker.
#
# Build the asset directory first (it is git-ignored, produced from HEAD):
#   node cloudflare/build.js
# Then, from this directory:
#   npx wrangler deploy
#
# Secrets, set once:
#   npx wrangler secret put RESEND_KEY
#   npx wrangler secret put HOOK_SECRET
#
# The analyser stays in its own Worker (lively-surf-87db). It is live and
# working, and merging it here would put a tested thing at risk to save a
# deployment.

name = "zerolines"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# "none", not "auto-trailing-slash". This site is a mix: /products/ is a
# directory index, while /faq.html and all 25 journal articles live at real
# .html URLs — a third of the site, every one of them indexed by Google at that
# exact address. auto-trailing-slash answers those with a 307 to an
# extensionless twin, which is a redirect on a third of the pages and a URL
# change Google has to re-learn in exchange for nothing. The Worker resolves
# directory indexes itself instead; see serveAsset in src/index.js.
html_handling = "none"
not_found_handling = "404-page"
# Without this the assets binding answers before the Worker ever runs, and with
# html_handling = "none" that means any directory-style URL — /, /products/,
# every product page — gets the 404 page while /index.html and /faq.html are
# served fine. It only shows up in a real browser: the binding takes that
# shortcut on requests carrying `sec-fetch-mode: navigate`, which curl does not
# send, so every command-line check passed while the whole site was broken.
run_worker_first = true

[[d1_databases]]
binding = "ZL_LEADS"
database_name = "zl-leads"
database_id = "16bb56f9-fbab-470c-a0d3-e6b94c10d8a4"

[vars]
ZL_NOTIFY = "info@zerolines.life"
# THE WEEKLY LETTER IS DISARMED. Leave this alone unless you mean it.
#
# The cron below wakes the Worker every Monday and it builds the letter for
# whichever article publishes that day. With ZL_SEND_LIVE anything other than
# "yes" it stops one step short of Resend: it selects the recipients, renders
# the letter, works out each person's unsubscribe link and writes all of it to
# the log, then returns. Nothing leaves the account.
#
# Read a dry run first — `npx wrangler tail`, or open
# /__forms/journal?k=HOOK_SECRET, which forces a dry run whatever this says.
# Then, when you have read what would go out and want it to go, change this to
# "yes" and deploy. Changing it in the dashboard works too, but only until the
# next deploy: every var here is written over the live ones each time.
ZL_SEND_LIVE = "no"

# Monday, 08:00 UTC. schedule.json dates every article to a Monday, and an
# article is live from midnight UTC on its date, so by eight it has been
# readable for eight hours — the letter never arrives before the page does.
[triggers]
crons = ["0 8 * * 1"]

# CUTOVER — blocked on one manual step, then uncomment both.
#
# Cloudflare refuses to attach a custom domain while the hostname still has
# "externally managed DNS records": error 100117. The apex A records and the
# www CNAME still point at Netlify, and deleting them needs DNS write access
# that the wrangler OAuth token does not carry — it can read the zone and not
# its records. So the three Netlify records have to go by hand first.
#
[[routes]]
pattern = "zerolines.life"
custom_domain = true
[[routes]]
pattern = "www.zerolines.life"
custom_domain = true
